name: Test

on:
  push:
    branches:
      - main
  # Every pull request, not only those into `main`: a stacked PR targets its parent,
  # and a `branches: [main]` filter reports "no checks" on it.
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # No `npm ci`: the specs use node's own runner and builtins, and there is no
      # dependency to install.
      - run: npm run check
